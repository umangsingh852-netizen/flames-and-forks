<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Flames & Forks</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Flames & Forks
        </div>

        <div class="nav-links">

            <a href="/">Home</a>
            <a href="/menu">Menu</a>
            <a href="/orders">My Orders</a>
            <a href="/cart">Cart</a>
            <a href="/logout">Logout</a>

        </div>

    </nav>


    <main class="dashboard-page">

        <section class="dashboard-hero">

            <h1>Welcome Back</h1>

            <p>
                Ready to satisfy your cravings?
            </p>

            <a href="/menu" class="btn">
                Explore Menu
            </a>

        </section>


        <section class="dashboard-grid">

            <a href="/menu" class="dashboard-card">

                <div class="dashboard-icon">
                    🍴
                </div>

                <h2>Explore Menu</h2>

                <p>
                    Discover delicious food from our menu.
                </p>

            </a>


            <a href="/cart" class="dashboard-card">

                <div class="dashboard-icon">
                    🛒
                </div>

                <h2>My Cart</h2>

                <p>
                    View your selected items and place an order.
                </p>

            </a>


            <a href="/orders" class="dashboard-card">

                <div class="dashboard-icon">
                    📦
                </div>

                <h2>My Orders</h2>

                <p>
                    Track your previous orders and their status.
                </p>

            </a>

        </section>

    </main>

</body>

</html> f
