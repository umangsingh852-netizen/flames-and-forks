<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Flames & Forks</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

    <div class="auth-page">

        <div class="auth-card">

            <h1>Flames & Forks</h1>

            <h2>Welcome Back</h2>

            <p class="auth-subtitle">
                Login to continue
            </p>


            <form method="POST">

                <div class="form-group">

                    <label>Username</label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit" class="auth-btn">
                    Login
                </button>

            </form>


            <p class="auth-footer">
                Don't have an account?

                <a href="/register">
                    Register
                </a>
            </p>


            <a href="/" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>

</body>

</html>
